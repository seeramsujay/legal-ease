<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215"/>
      <stop offset="100%" stop-color="#12252b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0575e6"/>
      <stop offset="50%" stop-color="#00f260"/>
      <stop offset="100%" stop-color="#0575e6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00f260" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Legal Privacy Shield Perimeter -->
  <path d="M 250 80 Q 370 80 370 190 C 370 300 250 395 250 415 C 250 395 130 300 130 190 Q 130 80 250 80 Z" fill="#0f1d24" stroke="url(#shieldGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Scales of Justice -->
  <!-- Central Pillar -->
  <line x1="250" y1="130" x2="250" y2="330" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Top Finial & Base -->
  <circle cx="250" cy="130" r="12" fill="url(#goldGrad)"/>
  <path d="M 215 330 L 285 330 M 205 345 L 295 345" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Balance Beam -->
  <line x1="175" y1="170" x2="325" y2="170" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Left Scale Pan -->
  <line x1="175" y1="170" x2="155" y2="230" stroke="#f6d365" stroke-width="2.5"/>
  <line x1="175" y1="170" x2="195" y2="230" stroke="#f6d365" stroke-width="2.5"/>
  <path d="M 150 230 Q 175 255 200 230 Z" fill="#1c333b" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Right Scale Pan -->
  <line x1="325" y1="170" x2="305" y2="230" stroke="#fda085" stroke-width="2.5"/>
  <line x1="325" y1="170" x2="345" y2="230" stroke="#fda085" stroke-width="2.5"/>
  <path d="M 300 230 Q 325 255 350 230 Z" fill="#1c333b" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Document Clause Inspection Indicator (Green Check / Lock) -->
  <circle cx="250" cy="275" r="26" fill="#00f260" fill-opacity="0.15" stroke="#00f260" stroke-width="3" filter="url(#glow)"/>
  <path d="M 240 275 L 247 282 L 262 267" fill="none" stroke="#00f260" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
